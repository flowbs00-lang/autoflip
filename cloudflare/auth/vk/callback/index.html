<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b13">
  <title>Вход в AutoFlip</title>
  <link rel="stylesheet" href="/assets/auth.css">
</head>
<body>

    <div class="brand"><img src="/assets/autoflip-vk-icon.png" alt=""><span>AutoFlip</span></div>

      <p class="status" id="status" role="status" aria-live="polite">Проверяем данные…</p>
    </section>
  </main>
  <script src="/assets/vkid-sdk-2.6.1.js"></script>
  <script src="/assets/vk-callback.js" defer></script>
</body>
</html>
