<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b13">
  <title>Создание профиля — AutoFlip</title>
  <link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
  <main class="shell">
    <div class="brand"><img src="/assets/autoflip-vk-icon.png" alt=""><span>AutoFlip</span></div>
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">Последний шаг</p>
      <h1 id="title">Выберите никнейм</h1>
      <p class="lead">Он будет виден другим игрокам. Каждый никнейм может принадлежать только одному аккаунту.</p>
      <form id="nickname-form">
        <div class="field">
          <label for="nickname">Никнейм</label>
          <input id="nickname" name="nickname" type="text" minlength="3" maxlength="20" autocomplete="nickname" autocapitalize="off" spellcheck="false" required>
        </div>
        <p class="hint">От 3 до 20 букв или цифр. Нижнее подчёркивание можно использовать между словами.</p>
        <button class="button" id="submit" type="submit">Создать профиль</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="/assets/setup-profile.js" defer></script>
</body>
</html>
