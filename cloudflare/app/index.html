<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b13">
  <title>AutoFlip — закрытая разработка</title>
  <link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
  <main class="shell">
    <div class="brand"><img src="/assets/autoflip-vk-icon.png" alt=""><span>AutoFlip</span></div>
    <section class="card" aria-labelledby="title">
      <p class="eyebrow">Профиль защищён</p>
      <h1 id="title">Вход работает</h1>
      <p class="lead" id="profile">Проверяем профиль…</p>
      <ul class="features">
        <li>VK ID привязан к профилю AutoFlip</li>
        <li>Сессия хранится в защищённой HttpOnly cookie</li>
        <li>Игра останется закрытой до завершения доработки</li>
      </ul>
      <button class="button" id="logout" type="button">Выйти</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="/assets/app-shell.js" defer></script>
</body>
</html>
